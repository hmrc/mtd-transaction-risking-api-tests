include "application.api-tests.conf"

# use this config for normal app on port 9858
mongodb.uri: "mongodb://localhost:27017/mtd-transaction-risking-retry-api-tests"

feature-switch {
    nrs-submission.enabled: true
    nrs-retry.enabled: true
    rsd-retry.enabled: true
}

rsd-retry {
    crypto.key: "aI7/ACVHrJOYOdI1pCVuOaulZomDlMiLYE08dyIX1lM="
    initial-delay: 1 second
    interval: 250 milliseconds
    initial-backoff: 2 seconds
    backoff-multiplier: 1.0
    max-backoff: 2 seconds
    max-retries: 10
}

nrs-retry {
    initial-delay: 1 second
    interval: 250 milliseconds
    initial-backoff: 2 seconds
    backoff-multiplier: 1.0
    max-backoff: 2 seconds
    max-retries: 10
    jitter-factor: 0.0
}