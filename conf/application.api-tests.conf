feature-switch {
    version-1.enabled: true
    auth.enabled: true
    nrs-submission.enabled: false
    nrs-retry.enabled: false
    rsd-retry.enabled: false
}

# Wiremock on port 9860. Mtd-transaction-risking-stub on 9859.
microservices.services {
    auth { host: localhost, port: 9860 }
    vat-api { host: localhost, port: 9860, submit-url: "/internal" }
    insights-proxy { host: localhost, port: 9860 }
    rds {
        host: localhost
        port: 9860
        protocol: http
        RdsAuthRequired: false
        acknowledge-url: "/rds/acknowledge"
        sas { host: localhost, port: 9860 }
    }
    interactions-datastore { host: localhost, port: 9860, protocol: http }
    nrs-orchestrator { host: localhost, port: 9860, protocol: http }
}